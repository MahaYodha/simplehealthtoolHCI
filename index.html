<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mental Health Challenges Rating Tool</title>
    <!-- React and ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@17/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@17/umd/react-dom.development.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Lodash -->
    <script src="https://cdn.jsdelivr.net/npm/lodash@4.17.21/lodash.min.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const _ = window._;

        // Define the challenges to be rated
        const challenges = [
            "Rise of AI Therapists may reshape care delivery, but could also deepen feelings of isolation.",
            "Psychiatry will expand into telemedicine, increasing accessibility but raising concerns about quality and consistency.",
            "Workplace stigma is likely to persist, despite growing awareness.",
            "Economic disparities may deepen, limiting access to quality mental health services for marginalized groups.",
            "Overall stigma around mental health may gradually decline, aided by advocacy and openness.",
            "Incidence of mental health challenges may rise, fueled by social, economic, and environmental stressors.",
            "Labour reforms and liberalized policies could result in greater job insecurity, increasing stress and anxiety.",
            "Mental illness may face growing trivialization or misrepresentation, especially on social media and in pop culture.",
            "Quality of mental health care providers may decline due to growing demand and limited training capacity.",
            "Demand for services will likely outstrip supply, worsening accessibility.",
            "Rising costs may place care out of reach for many, especially in the absence of public support.",
            "Out-of-pocket expenses for mental health treatment are expected to increase.",
            "Social isolation may become more widespread, particularly among vulnerable populations."
        ];

        // Define team members
        const teamMembers = ["You", "Rajiv", "Surinder", "Shilpa", "Bhavana", "Umang", "Dipen"];

        // Map rating values
        const ratingValues = {
            'High': 3,
            'Medium': 2,
            'Low': 1
        };

        function MentalHealthChallengesRating() {
            // State for ratings
            const [ratings, setRatings] = React.useState({});
            // State for average scores
            const [averageScores, setAverageScores] = React.useState([]);
            // State for top challenges
            const [topChallenges, setTopChallenges] = React.useState([]);
            // State for the number of top challenges to show
            const [topCount, setTopCount] = React.useState(5);
            // State to track if all members have rated
            const [allRated, setAllRated] = React.useState(false);
            // Ref for chart
            const chartRef = React.useRef(null);

            // Initialize ratings
            React.useEffect(() => {
                const initialRatings = {};
                teamMembers.forEach(member => {
                    initialRatings[member] = {};
                    challenges.forEach(challenge => {
                        initialRatings[member][challenge] = '';
                    });
                });
                setRatings(initialRatings);
            }, []);

            // Handle rating change
            const handleRatingChange = (member, challenge, value) => {
                setRatings(prev => ({
                    ...prev,
                    [member]: {
                        ...prev[member],
                        [challenge]: value
                    }
                }));
            };

            // Calculate average scores and top challenges when ratings change
            React.useEffect(() => {
                // Check if all team members have rated all challenges
                const hasAllRatings = Object.keys(ratings).length === teamMembers.length &&
                    Object.values(ratings).every(memberRatings => 
                        Object.keys(memberRatings).length === challenges.length &&
                        Object.values(memberRatings).every(rating => rating !== '')
                    );
                
                setAllRated(hasAllRatings);

                if (hasAllRatings) {
                    const scores = challenges.map(challenge => {
                        const sum = teamMembers.reduce((acc, member) => {
                            return acc + ratingValues[ratings[member][challenge]];
                        }, 0);
                        const average = sum / teamMembers.length;
                        return { challenge, score: average };
                    });

                    setAverageScores(scores);

                    // Get top challenges
                    const sortedScores = [...scores].sort((a, b) => b.score - a.score);
                    setTopChallenges(sortedScores.slice(0, topCount));
                }
            }, [ratings, topCount]);

            // Update chart when topChallenges changes
            React.useEffect(() => {
                if (allRated && chartRef.current) {
                    const ctx = chartRef.current.getContext('2d');
                    
                    // Destroy existing chart if it exists
                    if (window.myChart) {
                        window.myChart.destroy();
                    }

                    // Create new chart
                    window.myChart = new Chart(ctx, {
                        type: 'bar',
                        data: {
                            labels: topChallenges.map(item => item.challenge.length > 50 ? item.challenge.substring(0, 50) + '...' : item.challenge),
                            datasets: [{
                                label: 'Average Score',
                                data: topChallenges.map(item => item.score),
                                backgroundColor: '#8884d8',
                                borderColor: '#8884d8',
                                borderWidth: 1
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            scales: {
                                y: {
                                    beginAtZero: true,
                                    max: 3
                                }
                            },
                            plugins: {
                                tooltip: {
                                    callbacks: {
                                        label: function(context) {
                                            return `Score: ${context.raw.toFixed(2)}`;
                                        }
                                    }
                                }
                            }
                        }
                    });
                }
            }, [topChallenges, allRated]);

            // Export data to CSV
            const exportToCSV = () => {
                let csvContent = "Challenge,";
                
                // Add team members as headers
                teamMembers.forEach(member => {
                    csvContent += `${member},`;
                });
                
                csvContent += "Average Score\n";
                
                // Add challenges and ratings
                challenges.forEach(challenge => {
                    csvContent += `"${challenge}",`;
                    
                    // Add each member's rating
                    teamMembers.forEach(member => {
                        csvContent += `${ratings[member][challenge] || ''},`;
                    });
                    
                    // Add average score
                    const avg = averageScores.find(item => item.challenge === challenge)?.score || '';
                    csvContent += `${avg}\n`;
                });
                
                // Create download link
                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.setAttribute('href', url);
                link.setAttribute('download', 'mental_health_challenge_ratings.csv');
                link.style.visibility = 'hidden';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            // Generate random ratings for testing purposes
            const generateRandomRatings = () => {
                const ratingOptions = ['High', 'Medium', 'Low'];
                const randomRatings = {};
                
                teamMembers.forEach(member => {
                    randomRatings[member] = {};
                    challenges.forEach(challenge => {
                        const randomIndex = Math.floor(Math.random() * 3);
                        randomRatings[member][challenge] = ratingOptions[randomIndex];
                    });
                });
                
                setRatings(randomRatings);
                setAllRated(true);
            };

            return (
                <div className="p-6">
                    <h1 className="text-3xl font-bold mb-6 text-purple-800">Mental Health Challenges Rating Tool</h1>
                    
                    <div className="mb-4">
                        <p className="text-gray-700 mb-2">This tool helps you rate various mental health challenges and identify the top priorities.</p>
                        <div className="flex items-center mb-4">
                            <label className="mr-2">Show top:</label>
                            <select 
                                value={topCount} 
                                onChange={(e) => setTopCount(Number(e.target.value))}
                                className="border rounded px-2 py-1"
                            >
                                <option value={3}>3</option>
                                <option value={4}>4</option>
                                <option value={5}>5</option>
                            </select>
                            <button 
                                onClick={exportToCSV} 
                                className="ml-4 bg-green-600 text-white px-4 py-1 rounded hover:bg-green-700"
                            >
                                Export to CSV
                            </button>
                            <button 
                                onClick={generateRandomRatings} 
                                className="ml-4 bg-gray-500 text-white px-4 py-1 rounded hover:bg-gray-600"
                            >
                                Generate Sample Data
                            </button>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 gap-6 lg:grid-cols-2">
                        <div className="bg-white p-6 rounded-lg shadow-lg overflow-auto max-h-screen">
                            <h2 className="text-xl font-semibold mb-4 text-purple-800">Rating Sheet</h2>
                            <table className="w-full border-collapse">
                                <thead>
                                    <tr className="bg-purple-100">
                                        <th className="border p-2 w-1/2">Challenge</th>
                                        {teamMembers.map(member => (
                                            <th key={member} className="border p-2">{member}</th>
                                        ))}
                                    </tr>
                                </thead>
                                <tbody>
                                    {challenges.map((challenge, idx) => (
                                        <tr key={idx} className={idx % 2 === 0 ? 'bg-gray-50' : 'bg-white'}>
                                            <td className="border p-2 text-sm">{challenge}</td>
                                            {teamMembers.map(member => (
                                                <td key={`${member}-${idx}`} className="border p-2">
                                                    <select
                                                        value={ratings[member]?.[challenge] || ''}
                                                        onChange={(e) => handleRatingChange(member, challenge, e.target.value)}
                                                        className="w-full p-1 text-sm"
                                                    >
                                                        <option value="">Select...</option>
                                                        <option value="High">High</option>
                                                        <option value="Medium">Medium</option>
                                                        <option value="Low">Low</option>
                                                    </select>
                                                </td>
                                            ))}
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>

                        <div>
                            {allRated && (
                                <div className="bg-white p-6 rounded-lg shadow-lg mb-6">
                                    <h2 className="text-xl font-semibold mb-4 text-purple-800">Top {topCount} Challenges</h2>
                                    <div className="overflow-hidden" style={{ height: '300px' }}>
                                        <canvas ref={chartRef}></canvas>
                                    </div>

                                    <div className="mt-4">
                                        {topChallenges.map((item, index) => (
                                            <div key={index} className="mb-3 p-3 border-l-4 border-purple-500 bg-purple-50">
                                                <div className="flex justify-between">
                                                    <span className="font-medium text-gray-800">{index + 1}. {item.challenge}</span>
                                                    <span className="font-bold text-purple-800">{item.score.toFixed(2)}</span>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {!allRated && (
                                <div className="bg-white p-6 rounded-lg shadow-lg flex items-center justify-center h-64">
                                    <p className="text-gray-500 text-center">
                                        Complete all ratings to see the top challenges and visualization.
                                        <br />
                                        <span className="text-sm italic">Or click "Generate Sample Data" to see a demonstration</span>
                                    </p>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        // Render the component
        ReactDOM.render(<MentalHealthChallengesRating />, document.getElementById('root'));
    </script>
</body>
</html>
